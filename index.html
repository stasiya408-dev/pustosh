<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#3a2013}
body{font-family:Arial,sans-serif;color:#fff}
#bg,#art{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#art{background:url('bg.jpg') center/cover no-repeat}
.wrap{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:10px}
.top{background:#5a3418;border:3px solid #2b1608;border-radius:14px;padding:8px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 #2b1608}
.ava{width:56px;height:56px;border-radius:12px;background:#f0b35a;border:3px solid #2b1608;display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.info{flex:1;min-width:0}
.nm{font-weight:bold;font-size:15px;text-shadow:0 2px 0 #2b1608;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;background:#2b1608;border-radius:6px;margin-top:4px;overflow:hidden;border:2px solid #2b1608}
.bar div{height:100%;transition:width .3s}
#hpb{background:#d9432f}
#enb{background:#f2c230}
.res{font-size:13px;margin-top:4px;text-shadow:0 2px 0 #2b1608}
.spacer{flex:1;min-height:200px}
#log{background:rgba(43,22,8,.85);border:3px solid #2b1608;border-radius:12px;padding:8px;text-align:center;font-size:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:#e0892b;border:3px solid #2b1608;border-radius:14px;padding:12px 6px;font-size:15px;font-weight:bold;color:#fff;text-shadow:0 2px 0 #2b1608;box-shadow:0 5px 0 #2b1608}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2b1608}
.btn small{display:block;font-weight:normal;font-size:11px;margin-top:2px}
</style>
</head>
