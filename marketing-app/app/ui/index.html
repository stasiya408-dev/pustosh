<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пустошь Маркетинг</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#1a110a;--bg2:#241811;--panel:#2d1f15;--panel2:#382818;--line:#4a3320;--txt:#f3e6c8;--dim:#b9a47f;--gold:#d6942a;--gold2:#f0b84a;--red:#b8392f;--green:#5a9a42;--blue:#4a86b8;--r:12px}
@media (prefers-color-scheme:light){:root{--bg:#1a110a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 "Segoe UI",system-ui,Arial,sans-serif;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
#side{width:220px;flex:none;background:linear-gradient(180deg,#2a1b10,#1d130b);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
#logo{display:flex;align-items:center;gap:10px;margin:2px 6px 18px}
#logo i{width:38px;height:38px;border-radius:10px;background:radial-gradient(circle at 30% 25%,#e8a93a,#8d4a12);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:22px;color:#2a1306;box-shadow:0 2px 8px #0008}
#logo b{font-size:15px;line-height:1.15}
#logo small{display:block;color:var(--dim);font-weight:400;font-size:12px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--dim);padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.nav:hover{background:#ffffff0d;color:var(--txt)}
.nav.on{background:#d6942a26;color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold)}
.nav .em{font-size:18px;width:24px;text-align:center}
.nav .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#665;flex:none}
.nav .dot.ok{background:var(--green)}.nav .dot.warn{background:var(--gold)}
#sidefoot{margin-top:auto;color:var(--dim);font-size:12px;padding:8px}
#sidefoot button{margin-top:8px}
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#banner{display:none;background:#d6942a;color:#2a1306;padding:9px 18px;font-weight:600;align-items:center;gap:12px}
#banner button{margin-left:auto}
#main{flex:1;overflow:auto;padding:22px 28px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px;color:var(--gold2)}
.sub{color:var(--dim);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:160px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;color:var(--txt)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(180deg,#e0a03a,#b87414);border-color:#f0b84a;color:#2a1306;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.red{background:#7a2a22;border-color:#b8392f}
.btn.big{padding:12px 22px;font-size:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=search],textarea,select{width:100%;background:#1a110a;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:80px}
label.f{display:block;color:var(--dim);font-size:13px;margin:10px 0 4px}
.hint{color:var(--dim);font-size:13px}
.ok{color:#8fd27a}.bad{color:#ff8f84}.warn{color:var(--gold2)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:20px;background:#ffffff14;color:var(--dim);margin-left:6px;white-space:nowrap}
.tag.g{background:#5a9a4230;color:#9be07f}.tag.y{background:#d6942a30;color:var(--gold2)}.tag.r{background:#b8392f33;color:#ff9a90}
details{background:#1d140d;border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:10px 0}
summary{cursor:pointer;color:var(--gold2)}
details ol{margin:8px 0 4px;padding-left:20px}details li{margin:5px 0}
code{background:#0006;padding:1px 5px;border-radius:5px;font-size:13px}
#drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
#drop:hover,#drop.over{border-color:var(--gold);background:#d6942a12;color:var(--txt)}
#prev{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
#prev img,#prev video{max-width:260px;max-height:300px;border-radius:10px;border:1px solid var(--line);background:#000}
.bar{height:8px;border-radius:5px;background:#0006;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--gold);width:0}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.chk:first-of-type{border-top:0}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
/* телеграм */
#tgwrap{display:flex;gap:16px;align-items:flex-start}
#cats{width:230px;flex:none;position:sticky;top:0;max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.cat{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--txt)}
.cat:hover{background:#ffffff0d}.cat.on{background:#d6942a26;color:var(--gold2)}
.cat span.n{margin-left:auto;color:var(--dim);font-size:12.5px;white-space:nowrap}
.cat span.n b{color:var(--gold2);font-weight:600}
#chats{flex:1;min-width:0}
.chrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
.chrow:hover{background:#ffffff08}
.chrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);flex:none}
.chrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrow select{width:170px;flex:none;padding:5px 8px}
.chrow .t.wrap{white-space:normal;overflow:visible;line-height:1.7}
.chrow.off{opacity:.5}
.catrow{display:flex;align-items:center;gap:2px}
.catrow .ck{width:17px;height:17px;accent-color:var(--gold);margin:0 2px 0 6px;flex:none;cursor:pointer}
.catrow span.ck{display:inline-block;cursor:default}
.catrow .cat{flex:1;min-width:0}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:6px 10px;min-height:46px;min-width:200px}
.chip{display:inline-flex;gap:7px;align-items:center;background:#d6942a26;border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:3px 6px 3px 11px;font-size:13px}
.chip a{color:var(--dim);text-decoration:none;font-size:12px;padding:0 4px}.chip a:hover{color:var(--txt)}
.btn.find{background:linear-gradient(180deg,#4aa258,#2d7038);border-color:#76d884;color:#fff;font-weight:700}
.btn.find:hover{filter:brightness(1.1)}
.btn.save{border-color:#a56bd6;line-height:1.25;text-align:left}
.btn.save:hover{border-color:#c79af0}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13.5px;margin:10px 0}.stat b{color:var(--txt)}
/* публикация */
.job{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}.job:first-child{border-top:0}
.job .ic{width:26px;text-align:center;flex:none}
.job .m{color:var(--dim);font-size:13px}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal .box{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:20px 22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);padding:10px 18px;border-radius:10px;display:none;z-index:60;max-width:80vw}
a.btn{text-decoration:none;display:inline-block;color:var(--txt)}
.xbox{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.gal{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.gtile{width:215px;background:#1d140d;border:1px solid var(--line);border-radius:10px;padding:8px}
.gtile.used{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.gtile img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px;background:#000;display:block;margin-bottom:6px}
.gtile .btn{padding:5px 10px;font-size:13.5px}
.chat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;white-space:pre-wrap}.chat.me{background:#d6942a14}.chat.ai{background:#ffffff08}
@media (max-width:900px){#side{width:64px}#side .lbl,#logo b,#sidefoot{display:none}#cats{width:170px}.chrow select{width:120px}}
</style>
</head>
<body>
<aside id="side">
  <div id="logo"><i>П</i><b>Пустошь<br>Маркетинг<small>v__VERSION__</small></b></div>
  <button class="nav on" data-tab="post"><span class="em">✍</span><span class="lbl">Новый пост</span></button>
  <button class="nav" data-tab="tg"><span class="em">✈</span><span class="lbl">Telegram</span><span class="dot" id="d_tg"></span></button>
  <button class="nav" data-tab="conn"><span class="em">🔌</span><span class="lbl">Подключения</span><span class="dot" id="d_conn"></span></button>
  <button class="nav" data-tab="claude"><span class="em">🤖</span><span class="lbl">Claude и обновления</span><span class="dot" id="d_cl"></span></button>
  <div id="sidefoot">Окно можно закрыть: программа сама выключится через пару минут.<br><button class="btn" data-act="quit">Выключить сейчас</button></div>
</aside>
<div id="mainwrap">
  <div id="banner"><span id="bantxt"></span><button class="btn" data-act="goupdate">Обновить</button></div>
  <main id="main"></main>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*,video/*" style="display:none">
<script>
'use strict';
const TOKEN='__TOKEN__';
let S=null, tab='post', tgF={cat:'all',q:'',blocked:false,view:'mine',minm:50}, chatHist=[], uploading=null, pollT=null, busy={};

/* ---------- помощники ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t,ms=3500){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
async function api(path,body,method){
  method=method||(body===undefined?'GET':'POST');
  let r;
  try{r=await fetch(path,{method,headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){throw new Error('Программа не отвечает. Открой её заново значком на рабочем столе.')}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok||j.ok===false)throw new Error(j.error||('Ошибка '+r.status));
  return j;
}
async function act(fn,okMsg){try{const r=await fn();if(okMsg)toast(okMsg);return r}catch(e){toast('⚠ '+e.message,6000)}}
function askText(title,val,ph){return new Promise(res=>{
  $('#mbox').innerHTML=`<h2>${esc(title)}</h2><input type="text" id="mi" value="${esc(val||'')}" placeholder="${esc(ph||'')}"><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="mc">Отмена</button><button class="btn pri" id="mo">Готово</button></div>`;
  $('#modal').style.display='flex';const i=$('#mi');i.focus();i.select();
  const done=v=>{$('#modal').style.display='none';res(v)};
  $('#mc').onclick=()=>done(null);$('#mo').onclick=()=>done(i.value);i.onkeydown=e=>{if(e.key==='Enter')done(i.value);if(e.key==='Escape')done(null)};
})}
function askBox(html,okText,cancel){return new Promise(res=>{
  $('#mbox').innerHTML=html+`<div class="row" style="margin-top:16px;justify-content:flex-end">${cancel===false?'':'<button class="btn" id="mc">Отмена</button>'}<button class="btn pri" id="mo">${esc(okText||'Ок')}</button></div>`;
  $('#modal').style.display='flex';const done=v=>{$('#modal').style.display='none';res(v)};
  if($('#mc'))$('#mc').onclick=()=>done(false);$('#mo').onclick=()=>done(true);
})}
const fmtDur=s=>s?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):'';
function mins(n){n=Math.round(n);return n<1?'меньше минуты':n+' мин'}

/* ---------- состояние ---------- */
async function load(){S=await api('/api/state');paintShell();return S}
function paintShell(){
  const c=S.conn;
  $('#d_tg').className='dot '+(c.tg.state==='ready'?'ok':'warn');
  $('#d_conn').className='dot '+((c.ai&&(c.threads.ready||c.yt.connected))?'ok':'warn');
  $('#d_cl').className='dot '+(S.update&&S.update.newer?'warn':(c.ai?'ok':''));
  const b=$('#banner');
  if(S.update&&S.update.newer){b.style.display='flex';$('#bantxt').textContent='Вышла новая версия '+S.update.latest+(S.update.notes?': '+S.update.notes:'')}
  else b.style.display='none';
}
function focusInMain(){const a=document.activeElement;return a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=='checkbox'}
async function refresh(force){await load();if(force||!focusInMain())paint();else paintJob()}
function go(t){tab=t;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.tab===t));paint();$('#main').scrollTop=0;
  if(t==='tg'&&tgF.view==='base')loadBase().then(()=>{if(tab==='tg')paintTg()}).catch(()=>{})}
function paint(){const m=$('#main'),k=m.scrollTop;({post:paintPost,tg:paintTg,conn:paintConn,claude:paintClaude})[tab]();m.scrollTop=k;paintJob()}

/* ======================= НОВЫЙ ПОСТ ======================= */
function paintPost(){
  const d=S.draft,c=S.conn,m=d.media,t=d.texts;
  const nTg=d.tg_ids.length;
  $('#main').innerHTML=`
  <h1>Новый пост</h1><p class="sub">Файл из игры → ИИ пишет завлекающий текст → выбираешь, куда отправить → одна кнопка.</p>
  <div class="card"><h2>1. Фото или видео из игры</h2>
    ${m?`<div id="prev">${m.kind==='photo'?`<img src="${m.url}?t=${TOKEN}">`:`<video src="${m.url}?t=${TOKEN}" controls muted></video>`}
      <div><b>${esc(m.name||'')}</b><div class="hint">${m.kind==='photo'?'Фото':'Видео'}${m.dur?' · '+fmtDur(m.dur):''}${m.w?' · '+m.w+'×'+m.h:''}</div>
      ${m.kind==='video'&&m.w&&m.h&&m.w>m.h?'<div class="warn">Ролик горизонтальный — на YouTube это будет не Short. Для Shorts нужен вертикальный или квадратный.</div>':''}
      <p><button class="btn" data-act="clearmedia">Убрать файл</button> <button class="btn" data-act="pickfile">Выбрать другой</button></p></div></div><div id="extrabox" class="xbox"></div>`
    :`<div id="drop" data-act="pickfile">${uploading?`Загружаю… ${uploading}%<div class="bar"><i style="width:${uploading}%"></i></div>`:'Перетащи сюда фото или видео<br>или нажми, чтобы выбрать файл'}</div>`}
  </div>
  <div class="card"><h2>2. О чём пост <span class="hint">(не обязательно)</span></h2>
    <textarea id="note" placeholder="Например: показываю нового босса Ногая, он теперь нависает над экраном. Если пусто — ИИ посмотрит на картинку сам.">${esc(d.note)}</textarea></div>
  <div class="card"><h2>3. Куда публикуем</h2>
    <div class="chk"><span style="width:26px;text-align:center">✈</span><div class="grow"><b>Telegram-чаты</b><div class="hint">${c.tg.state!=='ready'?'Сначала войди в Telegram (вкладка «Telegram»).':(nTg?`Выбрано чатов: <b>${nTg}</b> · сегодня отправлено ${S.tg_today.sent} из ${S.tg_today.limit}`:'Пока ни одного чата не выбрано.')}</div></div><button class="btn" data-tab-go="tg">${nTg?'Изменить выбор':'Выбрать чаты'}</button></div>
    <label class="chk"><input type="checkbox" id="t_threads" ${d.threads?'checked':''} ${c.threads.ready?'':'disabled'}><span style="width:16px;text-align:center">🧵</span><div class="grow"><b>Threads</b><div class="hint">${c.threads.ready?esc(c.threads.text):'Не подключён (вкладка «Подключения»).'}</div></div></label>
    <label class="chk"><input type="checkbox" id="t_yt" ${d.yt?'checked':''} ${c.yt.connected?'':'disabled'}><span style="width:16px;text-align:center">▶</span><div class="grow"><b>YouTube Shorts</b><div class="hint">${c.yt.connected?'Нужен вертикальный ролик до 3 минут.':'Не подключён (вкладка «Подключения»).'}</div></div></label>
  </div>
  <div class="row" style="margin-bottom:18px"><button class="btn pri big" data-act="generate" ${busy.gen?'disabled':''}>${busy.gen?'<span class="spin">⏳</span> Пишу пост…':(t?'🔄 Написать заново':'✨ Сгенерировать пост')}</button>
    <span class="hint">${c.ai?'ИИ Claude подключён.':'<span class="warn">Ключ Claude не введён — будет простой текст без ИИ (вкладка «Подключения»).</span>'}</span></div>
  ${t?editor(d):''}
  <div id="jobbox"></div>`;
  bindPost();
}
function editor(d){
  const t=d.texts,m=d.media;
  return `<div class="card"><h2>Проверь и поправь текст</h2>
    <label class="f">Telegram</label><textarea id="x_tg" rows="6">${esc(t.telegram)}</textarea>
    <label class="f">Threads <span id="thc" class="hint">${t.threads.length}/500</span></label><textarea id="x_th" rows="4">${esc(t.threads)}</textarea>
    <label class="f">YouTube: название</label><input type="text" id="x_yt" value="${esc(t.youtube_title)}">
    <label class="f">YouTube: описание</label><textarea id="x_yd" rows="4">${esc(t.youtube_desc)}</textarea>
  </div>
  ${m&&m.kind==='photo'?`<div class="card"><h2>Картинка с надписью</h2><div class="row" style="align-items:flex-start">
    ${d.card_url?`<img src="${d.card_url}?t=${TOKEN}&r=${Date.now()}" style="max-width:240px;border-radius:10px;border:1px solid var(--line)">`:''}
    <div class="grow"><label class="chk" style="border:0"><input type="checkbox" id="card_on" ${d.card_on?'checked':''} ${S.conn.card?'':'disabled'}> Добавить заголовок и плашку «Играть» на фото</label>
    ${S.conn.card?'':'<div class="warn">В этой сборке нет модуля картинок.</div>'}
    <label class="f">Заголовок</label><input type="text" id="card_title" value="${esc(d.card_title)}">
    <label class="f">Подпись</label><input type="text" id="card_sub" value="${esc(d.card_sub)}">
    <p><button class="btn" data-act="redocard">Обновить картинку</button></p></div></div></div>`:''}
  <div class="row"><button class="btn pri big" data-act="publish">🚀 Опубликовать</button><span class="hint">Перед отправкой я покажу, что именно уйдёт и куда.</span></div>`;
}
/* ---- «Ещё дополнительно сгенерировать»: новые картинки от GPT по образцу фото ---- */
let xopt={idea:'',n:2,size:'tall',q:'medium',open:false}, xsig='', xPoll=null, xWas='';
function extExt(u){const i=u.lastIndexOf('.');return i>0?u.slice(i):'.jpg'}
function paintExtra(){
  const box=$('#extrabox');if(!box||!S)return;
  const x=S.extra,m=S.draft.media;
  if(!m){box.innerHTML='';return}
  const sig=JSON.stringify([x,m.url,S.conn.gpt]);
  if(sig===xsig&&box.firstChild)return;xsig=sig;
  const run=x.state==='running';
  const tile=(id,url,label,used,del)=>`<div class="gtile ${used?'used':''}"><img src="${url}?t=${TOKEN}" alt=""><div class="hint" style="margin-bottom:6px">${label}${used?' · <b class="ok">в посте</b>':''}</div>
    <div class="row" style="gap:6px"><button class="btn ${used?'':'pri'}" data-act="extrause" data-id="${id}" ${used?'disabled':''}>${used?'Выбрана':'В пост'}</button><a class="btn" href="${url}?t=${TOKEN}" download="pustosh_${id}${extExt(url)}">Сохранить</a>${del&&!used?`<button class="btn" data-act="extradel" data-id="${id}" title="Убрать из списка">✕</button>`:''}</div></div>`;
  const sel=(id,opts,v)=>`<select id="${id}">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(v)?'selected':''}>${o[1]}</option>`).join('')}</select>`;
  const tiles=[];
  if(x.items.length&&x.base)tiles.push(tile('orig',x.base.url,'Исходное фото',x.used==='orig',false));

function upload(f){
  if(!/^(image|video)\//.test(f.type)&&!/\.(jpe?g|png|webp|mp4|mov|m4v|webm)$/i.test(f.name)){toast('Нужна картинка или видео');return}
  uploading=0;paintPost();
  const x=new XMLHttpRequest();x.open('PUT','/api/upload?name='+encodeURIComponent(f.name));x.setRequestHeader('X-Token',TOKEN);
  x.upload.onprogress=e=>{if(e.lengthComputable){uploading=Math.round(e.loaded*100/e.total);const i=$('#drop .bar i');if(i)i.style.width=uploading+'%';if($('#drop'))$('#drop').firstChild.textContent='Загружаю… '+uploading+'%'}};
  x.onload=async()=>{uploading=null;let j={};try{j=JSON.parse(x.responseText)}catch(e){}
    if(x.status!==200||j.ok===false){toast('⚠ '+(j.error||'Не удалось загрузить файл'),6000);await refresh(true);return}
    await refresh(true);if(j.draft&&j.draft.media&&j.draft.media.kind==='video')videoMeta(j.draft.media.url)};
  x.onerror=()=>{uploading=null;toast('⚠ Не удалось загрузить файл');refresh(true)};
  x.send(f);
}
function videoMeta(url){
  const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=url+'?t='+TOKEN;
  v.onloadedmetadata=()=>{api('/api/media/meta',{w:v.videoWidth,h:v.videoHeight,dur:v.duration}).then(()=>refresh(true));v.currentTime=Math.min(1,(v.duration||2)/2)};
  v.onseeked=()=>{try{const k=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    c.toBlob(b=>{if(b)fetch('/api/upload?role=thumb&name=t.jpg',{method:'PUT',headers:{'X-Token':TOKEN},body:b})},'image/jpeg',.82)}catch(e){}};
}

function findBoxHtml(){

    return `<div class="card"><h2><span class="spin">🔎</span> Ищу новые группы по всему Telegram…</h2><div class="bar"><i style="width:${pct}%"></i></div>

  if(F.state==='idle'||!F.started||findDismiss===F.started)return '';
  const head=F.state==='error'?`<div class="bad">⚠ ${esc(F.msg)}</div>`:`<b>${F.state==='cancelled'?'Поиск остановлен':'Поиск закончен'}:</b> просмотрено запросов ${F.done} из ${F.total}, найдено новых чатов: <b>${F.new}</b>.`;
  return `<div class="card">${head}${F.warn?`<div class="warn" style="margin-top:6px">${esc(F.warn)}</div>`:''}${F.truncated?'<div class="hint" style="margin-top:6px">Тем выбрано много, поэтому за один раз проверено не всё. Запусти поиск ещё раз позже.</div>':''}

function pollFind(){
  clearTimeout(findPoll);
  if(!S||!S.find)return;
  if(S.find.state==='running'){findPoll=setTimeout(async()=>{
      try{if(tgF.view==='base')await loadBase();else await load()}catch(e){}
      if(tab==='tg'){if(focusInMain())paintFindBox();else paintTg()}
      pollFind()},2500);return}

    (async()=>{tgF.view='base';tgF.cat='all';try{await loadBase()}catch(e){}if(tab==='tg')paintTg();

}

    savetgkeys:async()=>{const b={TG_API_ID:$('#s_TG_API_ID').value};const h=$('#s_TG_API_HASH').value;if(h)b.TG_API_HASH=h;await act(()=>api('/api/settings',b),'Сохранено');refresh(true)},
    tgphone:async()=>{if(await act(()=>api('/api/tg/phone',{phone:$('#tg_phone').value})))refresh(true)},
    tgcode:async()=>{if(await act(()=>api('/api/tg/code',{code:$('#tg_code').value})))refresh(true)},
    tgpw:async()=>{if(await act(()=>api('/api/tg/password',{password:$('#tg_pw').value})))refresh(true)},
    tgback:async()=>{await act(()=>api('/api/tg/logout',{}));refresh(true)},
    tgout:async()=>{if(await askBox('<h2>Выйти из Telegram?</h2><div class="hint">Список чатов останется, но чтобы отправлять, нужно будет войти снова.</div>','Выйти')){await act(()=>api('/api/tg/logout',{}));refresh(true)}},
    viewmine:()=>{tgF.view='mine';paintTg()},
    viewbase:async()=>{tgF.view='base';try{await loadBase()}catch(e){toast('⚠ '+e.message)}paintTg()},
    fcatoff:()=>{findSel=findSel.filter(x=>x!==t.dataset.id);saveFindSel();paintTg()},
    fcatall:()=>{findSel=S.cats.map(c=>c.id).filter(x=>x!=='other');saveFindSel();paintTg()},
    fcatnone:()=>{findSel=[];saveFindSel();paintTg()},
    findstart:async()=>{
      const ids=findSel.filter(id=>id!=='other'&&S.cats.some(c=>c.id===id));
      if(!ids.length){toast('Сначала поставь галочки у тем слева (например, Игры или Рыбалка и охота)',5000);return}
      const nq=Math.min(120,ids.reduce((a,id)=>a+((S.find.queries||{})[id]||0),0)),mins=Math.max(1,Math.round(nq*6.5/60));
      const ok=await askBox(`<h2>🔎 Искать новые чаты?</h2><ul style="padding-left:18px"><li style="margin:6px 0">Темы: <b>${ids.map(id=>esc(catName(id))).join(', ')}</b></li>
        <li style="margin:6px 0">Запросов к Telegram: <b>${nq}</b>, займёт примерно <b>${mins} мин</b> (пауза 4–8 секунд между запросами, чтобы Телеграм не ограничил аккаунт).</li>
        <li style="margin:6px 0">Ищу по всему Telegram только <b>публичные группы с открытым чатом, где тебя ещё нет</b>. Вступать в них программа не будет.</li></ul>
        ${S.chats.length?'':'<div class="warn">Сначала лучше нажать «Загрузить чаты»: тогда я точно знаю, в каких группах ты уже состоишь, и не покажу их заново.</div>'}`,'Начать поиск');
      if(!ok)return;
      const r=await act(()=>api('/api/find/start',{cats:ids}));
      if(r){S.find=r.find;findWas=true;findDismiss=0;paintTg();pollFind()}},
    findcancel:async()=>{await act(()=>api('/api/find/cancel',{}));await load();paintTg()},
    findclose:()=>{findDismiss=S.find.started;paintFindBox()},
    basesave:async()=>{const r=await act(()=>api('/api/find/save',{}));if(r){toast('База сохранена: '+r.total+' чатов. Она останется в программе навсегда.',5000);await load();if(tgF.view==='base')await loadBase();paintTg()}},
    basedrop:async()=>{await act(()=>api('/api/find/drop',{ids:[t.dataset.id]}));await loadBase();paintTg()},
    basedropnew:async()=>{if(await askBox('<h2>Убрать несохранённые?</h2><div class="hint">Из базы пропадёт всё, что вы ещё не сохранили кнопкой «Сохранить базу».</div>','Убрать')){await act(()=>api('/api/find/drop',{unsaved:true}));await loadBase();paintTg()}},
    basecsv:()=>{const a=document.createElement('a');a.href='/api/find/export?t='+encodeURIComponent(TOKEN);a.download='pustosh_chat_base.csv';document.body.appendChild(a);a.click();a.remove()},
    tgload:async()=>{busy.load=true;paintTg();const r=await act(()=>api('/api/tg/load',{}));busy.load=false;if(r)toast('Найдено чатов: '+r.total+', писать можно в '+r.can_write,6000);refresh(true)},
    selvis:async()=>{const ids=visibleIds();await act(()=>api('/api/tg/bulk',{ids,sel:true}));refresh(true)},
    unselvis:async()=>{const ids=visibleIds();await act(()=>api('/api/tg/bulk',{ids,sel:false}));refresh(true)},
    catadd:async()=>{const n=await askText('Новая категория','','Например: Мото и байкеры');if(n){await act(()=>api('/api/cats',{op:'add',name:n}));refresh(true)}},
    catren:async()=>{const c=S.cats.find(c=>c.id===tgF.cat);const n=await askText('Новое название',c&&c.name);if(n){await act(()=>api('/api/cats',{op:'rename',id:tgF.cat,name:n}));refresh(true)}},
    catdel:async()=>{const c=S.cats.find(c=>c.id===tgF.cat);if(await askBox('<h2>Удалить категорию «'+esc(c&&c.name)+'»?</h2><div class="hint">Её чаты переедут в «Другое».</div>','Удалить')){await act(()=>api('/api/cats',{op:'delete',id:tgF.cat}));tgF.cat='all';refresh(true)}},
    savelimits:async()=>{await act(()=>api('/api/settings',{TG_DELAY_MIN:$('#s_TG_DELAY_MIN').value,TG_DELAY_MAX:$('#s_TG_DELAY_MAX').value,TG_DAILY_LIMIT:$('#s_TG_DAILY_LIMIT').value}),'Сохранено');refresh(true)},
    savegroup:async()=>{const b={};t.dataset.keys.split(',').forEach(k=>{const el=$('#s_'+k);if(el&&!(S.settings[k]&&S.settings[k].set!==undefined&&el.value===''))b[k]=el.value});await act(()=>api('/api/settings',b),'Сохранено');refresh(true)},
    thlink:async()=>{const r=await act(()=>api('/api/threads/link'));if(r)window.open(r.url,'_blank')},
    thcode:async()=>{const v=$('#th_code').value.trim();const r=await act(()=>/code=|^https?:/.test(v)||v.length<60?api('/api/threads/code',{text:v}):api('/api/threads/token',{token:v}));if(r){toast('Threads подключён: '+r.who);refresh(true)}},
    thout:async()=>{await act(()=>api('/api/threads/logout',{}));refresh(true)},
    ytsave:async()=>{const r=await act(()=>api('/api/yt/secret',{text:$('#yt_json').value}),'Файл сохранён');if(r)refresh(true)},
    ytlogin:async()=>{const r=await act(()=>api('/api/yt/login',{}));if(r){toast('Открылось окно браузера: разреши доступ к YouTube',6000);refresh(true)}},
    ytout:async()=>{await act(()=>api('/api/yt/logout',{}));refresh(true)},
    cltest:async()=>{$('#cltres').textContent='Спрашиваю…';try{const r=await api('/api/claude/test',{});$('#cltres').innerHTML='<span class="ok">✔ '+esc(r.answer)+'</span>'}catch(e){$('#cltres').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}},
    clask:async()=>{const i=$('#clq'),v=i.value.trim();if(!v)return;chatHist.push({role:'user',content:v});i.value='';paintClaude();try{const r=await api('/api/claude/ask',{text:v,history:chatHist.slice(0,-1)});chatHist.push({role:'assistant',content:r.answer})}catch(e){chatHist.push({role:'assistant',content:'⚠ '+e.message})}paintClaude()},
    upcheck:async()=>{await act(()=>api('/api/update/check'));refresh(true)},
    upinstall:async()=>{const r=await act(()=>api('/api/update/install',{}));if(r){document.body.innerHTML='<p style="padding:40px;font-size:18px">Обновление установлено. Программа перезапускается, окно откроется само через несколько секунд…</p>'}},
    report:async()=>{const r=await act(()=>api('/api/report'));if(r){const b=$('#repbox');b.style.display='block';b.value=r.text;b.select();try{await navigator.clipboard.writeText(r.text);toast('Скопировано. Вставь отчёт мне в чат.')}catch(e){toast('Выдели текст и скопируй (Ctrl+C)')}}},
  };
  if(A[a])A[a]();
});
function visibleIds(){return [...document.querySelectorAll('[data-sel]:not(:disabled)')].map(e=>e.dataset.sel)}
document.addEventListener('input',e=>{const t=e.target;if(t.id==='x_idea')xopt.idea=t.value});
document.addEventListener('toggle',e=>{if(e.target.id==='x_det')xopt.open=e.target.open},true);
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='x_n'){xopt.n=+t.value;return}if(t.id==='x_size'){xopt.size=t.value;return}if(t.id==='x_q'){xopt.q=t.value;return}
  if(t.dataset.fcat){findSel=findSel.filter(x=>x!==t.dataset.fcat);if(t.checked)findSel.push(t.dataset.fcat);saveFindSel();const k=$('#main').scrollTop;paintTg();$('#main').scrollTop=k;return}
  if(t.dataset.fcatsel){await act(()=>api('/api/find/cat',{id:t.dataset.fcatsel,cat:t.value}));await loadBase();const k=$('#main').scrollTop;paintTg();$('#main').scrollTop=k;return}
  if(t.id==='minm'){tgF.minm=+t.value;try{await loadBase()}catch(e){}paintTg();return}
  if(t.dataset.sel){await act(()=>api('/api/tg/chat',{id:t.dataset.sel,sel:t.checked}));await load();const k=$('#main').scrollTop;paintTg();$('#main').scrollTop=k;return}
  if(t.dataset.catsel){await act(()=>api('/api/tg/chat',{id:t.dataset.catsel,cat:t.value}));await load();const k=$('#main').scrollTop;paintTg();$('#main').scrollTop=k}
});
$('#file').onchange=e=>{if(e.target.files[0])upload(e.target.files[0]);e.target.value=''};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(tab==='post'&&!$('#drop')&&0)return});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='clq')document.querySelector('[data-act=clask]').click();if(e.key==='Enter'&&e.target.id==='tg_code')document.querySelector('[data-act=tgcode]').click();if(e.key==='Enter'&&e.target.id==='tg_pw')document.querySelector('[data-act=tgpw]').click();if(e.key==='Enter'&&e.target.id==='tg_phone')document.querySelector('[data-act=tgphone]').click()});
/* жив ли экран: сигнал программе, чтобы она не выключалась */
setInterval(()=>fetch('/api/ping',{headers:{'X-Token':TOKEN}}).catch(()=>{}),4000);
load().then(()=>{paint();if(S.job&&S.job.state==='running')pollJob();if(S.extra&&S.extra.state==='running'){xWas='running';pollExtra()};if(S.find&&S.find.state==='running'){findWas=true;pollFind()};if(!S.update&&!S.update_error)api('/api/update/check').then(()=>load()).catch(()=>{})});
</script>
</body>
</html>
