name: Build and smoke-test v173 without moustache-hand motion

on:
  push:
    branches:
      - codex/v173-ux-boss-forge
    paths:
      - .github/workflows/build-v173.yml
      - tools/patch_v173.py
      - tools/test_patch_v173.py
      - tools/mobile_smoke_v173.cjs
      - tools/build_standalone_v173.py
      - tools/disable_moustache_hand_v173.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build v173 only if input is still v172
        run: |
          if grep -q 'name="ver" content="172"' index.html; then
            python3 tools/patch_v173.py index.html _v173/index.html
            python3 tools/test_patch_v173.py index.html _v173/index.html
            cp _v173/index.html index.html
            mkdir -p assets/boss
            cp _v173/assets/boss/*.webp assets/boss/
          else
            grep -q 'name="ver" content="173"' index.html
            echo "Already built v173; checking mobile runtime."
          fi
      - name: Remove hero moustache-hand animation
        run: python3 tools/disable_moustache_hand_v173.py
      - name: Commit only generated game files on this feature branch
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add index.html assets/boss
          if ! git diff --cached --quiet; then
            git commit -m "Disable kazak moustache-hand motion [skip ci]"
            git push origin HEAD:codex/v173-ux-boss-forge
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright JavaScript driver
        run: npm install --no-save --no-audit --no-fund playwright@1.58.2
      - name: Run actual Chrome 390x780 alpha smoke test
        run: node tools/mobile_smoke_v173.cjs
      - name: Attach mobile screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v173-mobile-smoke-captures
          path: smoke-mobile-*.png
          if-no-files-found: ignore
      - name: Build one-file offline HTML preview
        run: python3 tools/build_standalone_v173.py
      - name: Downloadable standalone HTML with static hand
        uses: actions/upload-artifact@v4
        with:
          name: game-v173-no-moustache-html
          path: game_v173_standalone.html
          if-no-files-found: error
          retention-days: 90
